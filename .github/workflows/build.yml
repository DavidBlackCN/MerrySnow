name: Build

on:
  push:
    branches: ["*"]
    paths:
      - "src/**"
      - "gradle/**"
      - "*.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  pull_request:
    branches: ["*"]
    paths:
      - "src/**"
      - "gradle/**"
      - "*.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: chmod +x ./gradlew && ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MerrySnow
          path: build/libs/*.jar
